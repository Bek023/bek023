<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','Consolas','Menlo',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#03110d"/>
      <stop offset="100%" stop-color="#02201a"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1120" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a2e27"/>
      <stop offset="55%" stop-color="#0e3d33"/>
      <stop offset="100%" stop-color="#0a2e27"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="540" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a2e27"/>
      <stop offset="100%" stop-color="#0c332b"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 150) scale(260)">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 500) scale(300)">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="barTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <clipPath id="roundedAll"><rect x="0" y="0" width="1200" height="640" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#roundedAll)">
    <rect width="1200" height="640" fill="url(#bg)"/>
    <rect width="1200" height="640" fill="url(#glow1)"/>
    <rect width="1200" height="640" fill="url(#glow2)"/>
    <rect x="0" y="0" width="1200" height="640" fill="none" stroke="#134e42" stroke-width="2"/>

    <!-- title bar -->
    <circle cx="38" cy="34" r="7" fill="#ff5f56"/>
    <circle cx="64" cy="34" r="7" fill="#ffbd2e"/>
    <circle cx="90" cy="34" r="7" fill="#27c93f"/>
    <text x="140" y="41" font-size="18" fill="#8fb5ad" font-weight="600">bek023 — showcase</text>
    <text x="1160" y="41" font-size="14" fill="#3a5f57" text-anchor="end">github.com/bek023</text>

    <!-- hero card -->
    <rect x="40" y="70" width="1120" height="330" rx="26" fill="url(#hero)" stroke="#1f6e5f" stroke-width="1.5"/>
    <circle cx="1050" cy="130" r="4" fill="#5eead4"/>
    <path d="M 260 150 C 380 110, 480 110, 560 148" stroke="#3a6f64" stroke-width="1.5" fill="none" opacity="0.7"/>

    <!-- avatar -->
    <circle cx="170" cy="235" r="72" fill="#e9fffb" stroke="#2dd4bf" stroke-width="4"/>
    <g transform="translate(170,235)">
      <rect x="-30" y="-12" width="60" height="46" rx="14" fill="#34d399"/>
      <rect x="-14" y="-34" width="28" height="24" rx="8" fill="#34d399"/>
      <rect x="-10" y="-2" width="9" height="9" fill="#e9fffb"/>
      <rect x="1" y="-2" width="9" height="9" fill="#e9fffb"/>
    </g>

    <text x="262" y="150" font-size="24" fill="#5eead4" font-weight="700">@bek023</text>
    <text x="262" y="222" font-size="58" fill="#f4fffd" font-weight="800" font-family="Arial, Helvetica, sans-serif">bek</text>
    <text x="262" y="262" font-size="21" fill="#9fd8cc" font-family="Arial, Helvetica, sans-serif">Building real-time apps with Flutter &amp; Dart.</text>

    <!-- tag pills -->
    <g font-size="17" font-weight="600">
      <rect x="262" y="300" width="98" height="42" rx="21" fill="#0c332b" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="311" y="327" fill="#eafff9" text-anchor="middle">Dart</text>

      <rect x="372" y="300" width="150" height="42" rx="21" fill="#0c332b" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="447" y="327" fill="#eafff9" text-anchor="middle">JavaScript</text>

      <rect x="534" y="300" width="98" height="42" rx="21" fill="#0c332b" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="583" y="327" fill="#eafff9" text-anchor="middle">HTML</text>

      <rect x="644" y="300" width="122" height="42" rx="21" fill="#0c332b" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="705" y="327" fill="#eafff9" text-anchor="middle">Flutter</text>
    </g>

    <text x="1130" y="380" font-size="14" fill="#3a5f57" text-anchor="end">12 repos · shipping since 2025</text>

    <!-- Profile Signal card -->
    <rect x="40" y="420" width="540" height="180" rx="24" fill="url(#card)" stroke="#1f6e5f" stroke-width="1.5"/>
    <text x="66" y="458" font-size="21" fill="#f4fffd" font-weight="700" font-family="Arial, Helvetica, sans-serif">Profile Signal</text>
    <text x="66" y="480" font-size="13" fill="#5f8f84">Live GitHub stats, pulled straight from the API</text>
    <circle cx="548" cy="452" r="4" fill="#34d399"/>

    <!-- stat: Stars -->
    <text x="66" y="524" font-size="13" fill="#7fb3a8" font-weight="600">STARS</text>
    <text x="66" y="552" font-size="30" fill="#5eead4" font-weight="800" font-family="Arial, Helvetica, sans-serif">0</text>
    <rect x="66" y="562" width="100" height="5" rx="2.5" fill="#123c34"/>
    <rect x="66" y="562" width="6" height="5" rx="2.5" fill="url(#barTeal)"/>

    <!-- stat: Contributions -->
    <text x="200" y="524" font-size="13" fill="#7fb3a8" font-weight="600">CONTRIBUTIONS</text>
    <text x="200" y="552" font-size="30" fill="#a78bfa" font-weight="800" font-family="Arial, Helvetica, sans-serif">420</text>
    <rect x="200" y="562" width="120" height="5" rx="2.5" fill="#123c34"/>
    <rect x="200" y="562" width="112" height="5" rx="2.5" fill="url(#barPurple)"/>

    <!-- stat: Repos -->
    <text x="356" y="524" font-size="13" fill="#7fb3a8" font-weight="600">REPOS</text>
    <text x="356" y="552" font-size="30" fill="#5eead4" font-weight="800" font-family="Arial, Helvetica, sans-serif">12</text>
    <rect x="356" y="562" width="90" height="5" rx="2.5" fill="#123c34"/>
    <rect x="356" y="562" width="58" height="5" rx="2.5" fill="url(#barTeal)"/>

    <!-- stat: Followers -->
    <text x="478" y="524" font-size="13" fill="#7fb3a8" font-weight="600">FOLLOWERS</text>
    <text x="478" y="552" font-size="30" fill="#5eead4" font-weight="800" font-family="Arial, Helvetica, sans-serif">0</text>
    <rect x="478" y="562" width="80" height="5" rx="2.5" fill="#123c34"/>
    <rect x="478" y="562" width="6" height="5" rx="2.5" fill="url(#barTeal)"/>

    <!-- Projects card -->
    <rect x="600" y="420" width="560" height="180" rx="24" fill="url(#card)" stroke="#1f6e5f" stroke-width="1.5"/>
    <text x="626" y="452" font-size="14" fill="#5eead4" font-weight="700">PROJECTS.LIST</text>
    <text x="736" y="452" font-size="13" fill="#4d766c">./projects.sh --pinned</text>
    <text x="1134" y="452" font-size="12" fill="#3a5f57" text-anchor="end">2 pinned</text>

    <!-- project 1 -->
    <rect x="626" y="470" width="248" height="112" rx="14" fill="#082621" stroke="#215e51" stroke-width="1"/>
    <circle cx="644" cy="490" r="4" fill="#34d399"/>
    <text x="656" y="494" font-size="14" fill="#8fb5ad">ConnectHub</text>
    <text x="644" y="518" font-size="15" fill="#f4fffd" font-weight="700" font-family="Arial, Helvetica, sans-serif">ConnectHub</text>
    <text x="644" y="538" font-size="12" fill="#7fb3a8">Real-time chat app in Flutter.</text>
    <rect x="644" y="552" width="52" height="22" rx="11" fill="#0c332b" stroke="#2dd4bf" stroke-width="1"/>
    <text x="670" y="567" font-size="11" fill="#a7f3e8" text-anchor="middle">Dart</text>
    <text x="850" y="574" font-size="11" fill="#3a5f57" text-anchor="end">updated recently</text>

    <!-- project 2 -->
    <rect x="886" y="470" width="248" height="112" rx="14" fill="#082621" stroke="#215e51" stroke-width="1"/>
    <circle cx="904" cy="490" r="4" fill="#a78bfa"/>
    <text x="916" y="494" font-size="14" fill="#8fb5ad">game2048</text>
    <text x="904" y="518" font-size="15" fill="#f4fffd" font-weight="700" font-family="Arial, Helvetica, sans-serif">game2048</text>
    <text x="904" y="538" font-size="12" fill="#7fb3a8">2048 puzzle game in Flutter.</text>
    <rect x="904" y="552" width="52" height="22" rx="11" fill="#0c332b" stroke="#2dd4bf" stroke-width="1"/>
    <text x="930" y="567" font-size="11" fill="#a7f3e8" text-anchor="middle">Dart</text>
    <text x="1110" y="574" font-size="11" fill="#3a5f57" text-anchor="end">updated recently</text>
  </g>
</svg>
